# =========================================================
# APPLICATION
# =========================================================

spring.application.name=FinanceApplication

server.port=8080


# =========================================================
# MYSQL DATABASE
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/financeDatabase?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=Root@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.pool-name=FinanceHikariPool

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO

logging.level.com.finance=DEBUG

logging.level.org.springframework.web=INFO

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,loggers,beans,mappings

management.endpoint.health.show-details=always

management.info.env.enabled=true


# =========================================================
# APPLICATION INFORMATION FOR ACTUATOR
# =========================================================

info.app.name= FinanceApplication

info.app.description=Finance REST API

info.app.version=1.0.0


# =========================================================
# SWAGGER / OPENAPI
# =========================================================

springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.path=/swagger-ui.html


# =========================================================
# JSON
# =========================================================

spring.jackson.serialization.fail-on-empty-beans=false

# ============================================================
# FINANCE SCHEDULER
# ============================================================

# Investment maintenance runs every day at 1:00 AM
finance.scheduler.investment-maintenance-cron=0 0 1 * * *